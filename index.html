<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFlow Dasis - Smart Engine</title>
    <!-- Library CSS & Framework -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Menggunakan font Arial sesuai permintaan sebelumnya */
        body, input, select, button { 
            font-family: Arial, Helvetica, sans-serif !important; 
            -webkit-font-smoothing: antialiased; 
        }
        .panel-monitor { background: linear-gradient(165deg, #0f172a 0%, #1e293b 100%); }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body class="bg-[#f8fafc] text-[#334155]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- KONFIGURASI GOOGLE APPS SCRIPT (GAS) ---
        // Ganti URL di bawah dengan URL hasil "Deploy as Web App" Anda
        const MASTER_GAS_URL = "https://script.google.com/macros/s/AKfycbwHbEQxX850y8HT8GmN65XGy-Q331RYh_-SSvUCGvvCDVGjEpLjlMfxYhgMCVZheXL_cQ/exec";

        // Komponen Ikon Lucide yang stabil untuk pratinjau
        const Icon = ({ name, className = "w-5 h-5", strokeWidth = 2 }) => {
            useEffect(() => { 
                if (window.lucide) window.lucide.createIcons(); 
            }, [name]);
            return <i data-lucide={name} className={className} style={{strokeWidth}}></i>;
        };

        const App = () => {
            const [isProcessing, setIsProcessing] = useState(false);
            const [step, setStep] = useState(0); 
            const [notification, setNotification] = useState(null);
            const [studentData, setStudentData] = useState({ nama: '', kelas: '', kk: null, akte: null, pip: null });

            const showNotify = (type, message) => {
                setNotification({ type, message });
                setTimeout(() => setNotification(null), 6000);
            };

            const convertToBase64 = (file) => {
                if (!file) return null;
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                });
            };

            const runAutomation = async (e) => {
                e.preventDefault();
                if (MASTER_GAS_URL.includes("MASUKKAN_URL")) {
                    return showNotify('error', 'Konfigurasi Backend (GAS URL) belum diisi dalam kode.');
                }
                if (!studentData.nama || !studentData.kelas) return showNotify('error', 'Lengkapi identitas siswa.');
                if (!studentData.kk || !studentData.akte || !studentData.pip) return showNotify('error', 'Lengkapi ketiga foto dokumen.');

                setIsProcessing(true);
                setStep(1); // Uploading
                
                try {
                    const b64KK = await convertToBase64(studentData.kk);
                    const b64Akte = await convertToBase64(studentData.akte);
                    const b64PIP = await convertToBase64(studentData.pip);

                    setStep(2); // AI Processing
                    const payload = {
                        nama_siswa: studentData.nama,
                        kelas: studentData.kelas,
                        foto_kk: b64KK,
                        foto_akte: b64Akte,
                        foto_pip: b64PIP
                    };

                    const response = await fetch(MASTER_GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });

                    setStep(3); // Syncing
                    setTimeout(() => {
                        setStep(4);
                        showNotify('success', 'Data ' + studentData.nama + ' berhasil diarsipkan!');
                        setStudentData({ nama: '', kelas: '', kk: null, akte: null, pip: null });
                        setTimeout(() => { setStep(0); setIsProcessing(false); }, 4000);
                    }, 1000);
                } catch (err) {
                    showNotify('error', 'Gagal: ' + err.message);
                    setStep(0);
                    setIsProcessing(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col text-left">
                    {notification && (
                        <div className={`fixed top-8 right-8 z-[100] p-4 rounded shadow-2xl flex items-center gap-3 border backdrop-blur-md fade-in ${
                            notification.type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-800'
                        }`}>
                            <Icon name={notification.type === 'success' ? 'check-circle' : 'alert-circle'} />
                            <div className="text-sm font-bold">{notification.message}</div>
                        </div>
                    )}

                    <nav className="bg-white/95 border-b border-slate-200 px-8 py-5 flex justify-between items-center sticky top-0 z-50">
                        <div className="flex items-center gap-4">
                            <div className="bg-indigo-600 p-2 rounded text-white shadow-lg"><Icon name="zap" strokeWidth={2.5} /></div>
                            <div>
                                <h1 className="font-bold text-lg tracking-tight text-slate-900 leading-none">EDUFLOW DASIS</h1>
                                <p className="text-[10px] font-normal text-indigo-600 mt-1 uppercase leading-none">Smart Engine v3.0</p>
                            </div>
                        </div>
                        <div className="hidden md:flex items-center gap-2 px-3 py-1 bg-emerald-50 text-emerald-600 rounded-full text-[10px] font-bold uppercase tracking-wider">
                            <div className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
                            Server Aktif
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto p-6 md:p-12 w-full flex-grow">
                        <div className="grid lg:grid-cols-12 gap-8 items-start">
                            
                            {/* Formulir Input */}
                            <div className="lg:col-span-7 bg-white p-8 md:p-10 rounded-xl border border-slate-200 shadow-sm fade-in">
                                <div className="flex items-center gap-4 mb-8 border-b border-slate-100 pb-6">
                                    <div className="p-2.5 bg-slate-50 rounded text-slate-600"><Icon name="file-up" strokeWidth={2} /></div>
                                    <div>
                                        <h2 className="text-xl font-bold text-slate-900 leading-none">Pendaftaran Berkas</h2>
                                        <p className="text-sm text-slate-400 mt-1.5 font-normal italic">Gunakan foto dokumen asli yang jelas</p>
                                    </div>
                                </div>

                                <form onSubmit={runAutomation} className="space-y-8">
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                        <div className="md:col-span-3 space-y-2">
                                            <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-0.5">Nama Lengkap Siswa</label>
                                            <input type="text" required className="w-full px-4 py-3 rounded border border-slate-200 bg-slate-50 focus:border-indigo-600 focus:bg-white transition-all outline-none text-base" value={studentData.nama} onChange={(e) => setStudentData({...studentData, nama: e.target.value})} placeholder="Sesuai Ijazah..." />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Kelas</label>
                                            <div className="relative">
                                                <select required className="w-full px-4 py-3 rounded border border-slate-200 bg-slate-50 focus:border-indigo-600 appearance-none cursor-pointer" value={studentData.kelas} onChange={(e) => setStudentData({...studentData, kelas: e.target.value})}>
                                                    <option value="" disabled>-</option>
                                                    {[1,2,3,4,5,6].map(k => <option key={k} value={k}>{k}</option>)}
                                                </select>
                                                <Icon name="chevron-down" className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" size={16} />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <UploadCard label="Foto KK" theme="blue" icon="users" file={studentData.kk} onChange={(e)=>setStudentData({...studentData, kk: e.target.files[0]})} />
                                        <UploadCard label="Foto Akte" theme="emerald" icon="file-badge" file={studentData.akte} onChange={(e)=>setStudentData({...studentData, akte: e.target.files[0]})} />
                                        <UploadCard label="Rekening PIP" theme="amber" icon="landmark" file={studentData.pip} onChange={(e)=>setStudentData({...studentData, pip: e.target.files[0]})} />
                                    </div>

                                    <button disabled={isProcessing} className={`w-full py-4 rounded font-bold text-white shadow-lg transition-all flex justify-center items-center gap-3 text-lg ${isProcessing ? 'bg-slate-300' : 'bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99]'}`}>
                                        {isProcessing ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="send" />}
                                        {isProcessing ? 'SEDANG MENYIMPAN...' : 'KIRIM BERKAS SEKARANG'}
                                    </button>
                                </form>
                            </div>
                            
                            {/* Panel Monitor */}
                            <div className="lg:col-span-5 panel-monitor rounded-xl p-8 md:p-10 text-white shadow-xl">
                                <h3 className="font-bold text-lg mb-10 border-b border-white/10 pb-5 uppercase tracking-tight">Monitor Transmisi</h3>
                                <div className="space-y-10 relative">
                                    <StatusStep label="Cloud Upload" desc="Drive Storage Sync" icon="cloud-upload" stepNum={1} currentStep={step} completed={step > 1} />
                                    <StatusStep label="AI Vision" desc="OCR Text Extraction" icon="scan-eye" stepNum={2} currentStep={step} completed={step > 2} />
                                    <StatusStep label="G-Sync" desc="Sheet Entry Logging" icon="database" stepNum={3} currentStep={step} completed={step >= 4} />
                                </div>
                                <div className="mt-12 p-4 bg-white/5 border border-white/10 rounded-lg text-left">
                                    <p className="text-[10px] text-white/50 uppercase font-bold tracking-widest mb-1">Status Server</p>
                                    <div className="text-xs text-emerald-400 font-bold flex items-center gap-2 animate-pulse">
                                        <div className="w-1.5 h-1.5 rounded-full bg-emerald-400"></div> 
                                        SISTEM SIAP MENERIMA DATA
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer className="py-10 px-12 border-t border-slate-200 bg-white flex justify-center items-center mt-auto">
                        <p className="text-slate-400 text-[10px] uppercase tracking-[0.5em]">EDUFLOW DASIS &copy; 2025 by INISIAL TH</p>
                    </footer>
                </div>
            );
        };

        const UploadCard = ({ label, theme, icon, file, onChange }) => {
            const colors = { blue: 'text-indigo-600', emerald: 'text-emerald-600', amber: 'text-amber-600', default: 'text-slate-400' };
            const border = file ? 'border-indigo-600 bg-indigo-50/50 shadow-inner' : 'border-slate-200 bg-slate-50 hover:border-indigo-300';
            return (
                <div className={`p-4 rounded border-2 transition-all h-full flex flex-col items-center justify-center text-center relative group ${border}`}>
                    <div className={`p-2.5 rounded-full mb-3 transition-all ${file ? 'bg-white shadow-sm scale-110' : 'bg-white'}`}>
                        <Icon name={icon} className={`w-6 h-6 mx-auto ${file ? colors[theme] : colors.default}`} />
                    </div>
                    <p className={`text-[10px] font-bold uppercase tracking-wider mb-1 ${file ? 'text-slate-900' : 'text-slate-500'}`}>{label}</p>
                    <p className="text-[9px] text-slate-400 truncate w-full px-2 italic font-normal">{file ? file.name : "Pilih Foto"}</p>
                    <input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer" onChange={onChange} />
                </div>
            );
        };

        const StatusStep = ({ label, desc, icon, completed, currentStep, stepNum }) => {
            const isC = currentStep === stepNum;
            return (
                <div className="flex items-start gap-6 relative">
                    {stepNum < 3 && <div className={`absolute left-[27px] top-[52px] bottom-[-40px] w-[2px] transition-colors duration-1000 ${completed ? 'bg-emerald-500' : 'bg-white/10'}`}></div>}
                    <div className={`w-14 h-14 rounded flex items-center justify-center z-10 shadow-lg transition-all ${completed ? 'bg-emerald-500 scale-105 shadow-emerald-500/20' : isC ? 'bg-indigo-600 ring-[6px] ring-indigo-600/20' : 'bg-slate-800 border border-white/5'}`}>
                        {completed ? <Icon name="check" className="text-white" strokeWidth={3} /> : <Icon name={icon} className="text-white" />}
                    </div>
                    <div className="flex flex-col justify-center h-14">
                        <span className={`text-lg font-bold tracking-tight leading-none ${completed ? 'text-emerald-400' : 'text-white'}`}>{label}</span>
                        <span className={`text-[10px] font-normal uppercase tracking-widest mt-2 ${completed ? 'text-emerald-400/80' : 'text-white'}`}>{desc}</span>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
