<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFlow Dasis Engine - INISIAL TH</title>
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel untuk menjalankan JSX langsung di Browser -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body { 
            background-color: #f8fafc; 
            font-family: 'Inter', sans-serif; 
        }
        .text-left { text-align: left; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Komponen Notifikasi (Toast)
        const Notification = ({ type, message }) => (
            <div className={`fixed top-4 right-4 z-[100] p-4 rounded-2xl shadow-2xl flex items-center gap-3 border animate-bounce ${
                type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' :
                type === 'error' ? 'bg-red-50 border-red-200 text-red-800' :
                'bg-blue-50 border-blue-200 text-blue-800'
            }`}>
                <i data-lucide={type === 'success' ? 'check-circle' : type === 'error' ? 'x-circle' : 'alert-circle'} className="w-5 h-5"></i>
                <p className="text-sm font-semibold">{message}</p>
            </div>
        );

        // Komponen Card Upload
        const FileUploadCard = ({ label, iconName, iconColor, file, onChange }) => (
            <div className="relative group h-40">
                <div className={`p-4 rounded-3xl border-2 border-dashed transition-all h-full flex flex-col items-center justify-center text-center ${file ? 'border-emerald-200 bg-emerald-50' : 'border-slate-200 bg-white group-hover:bg-blue-50/50'}`}>
                    <div className={`mb-3 p-3 bg-white rounded-2xl shadow-sm ${iconColor}`}>
                        <i data-lucide={iconName} className="w-6 h-6"></i>
                    </div>
                    <p className="text-[10px] font-black text-slate-700 uppercase tracking-tighter mb-1 leading-tight">{label}</p>
                    <p className="text-[9px] text-slate-400 truncate w-full px-4 italic">{file ? file.name : 'Pilih Foto'}</p>
                    <input type="file" accept="image/*" onChange={onChange} className="absolute inset-0 opacity-0 cursor-pointer" />
                </div>
            </div>
        );

        const App = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [view, setView] = useState('student'); 
            const [isProcessing, setIsProcessing] = useState(false);
            const [step, setStep] = useState(0); 
            const [notification, setNotification] = useState(null);
            
            const [config, setConfig] = useState({
                apiKey: '',
                clientId: '',
                folderId: '',
                spreadsheetId: '',
                masterPassword: 'admin123'
            });

            const [studentData, setStudentData] = useState({ nama: '', kk: null, akte: null, pip: null });
            const [logs, setLogs] = useState([
                { id: 1, nama: 'Siswa Contoh', status: 'Selesai', waktu: '20/12/2023 10:00', tipe: 'KK' }
            ]);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const showNotify = (type, message) => {
                setNotification({ type, message });
                setTimeout(() => setNotification(null), 4000);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (adminPassword === config.masterPassword) {
                    setIsAuthenticated(true);
                    setView('admin');
                    showNotify('success', 'Berhasil masuk ke Panel Admin.');
                } else {
                    showNotify('error', 'Password salah!');
                }
            };

            const runAutomation = async (e) => {
                e.preventDefault();
                if (!studentData.nama || !studentData.kk) {
                    showNotify('error', 'Nama dan Foto KK wajib ada.');
                    return;
                }
                setIsProcessing(true);
                setStep(1); await new Promise(r => setTimeout(r, 1500)); 
                setStep(2); await new Promise(r => setTimeout(r, 2000)); 
                setStep(3); await new Promise(r => setTimeout(r, 1200)); 
                setIsProcessing(false);
                setStep(0);
                
                const newLog = { 
                    id: Date.now(), 
                    nama: studentData.nama, 
                    status: 'Selesai', 
                    waktu: new Date().toLocaleString('id-ID'), 
                    tipe: 'Set Lengkap' 
                };
                setLogs([newLog, ...logs]);
                showNotify('success', 'Mesin berhasil memproses data siswa!');
                setStudentData({ nama: '', kk: null, akte: null, pip: null });
            };

            return (
                <div className="min-h-screen text-slate-800">
                    {notification && <Notification {...notification} />}

                    <nav className="bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2 rounded-xl text-white shadow-lg shadow-blue-200">
                                <i data-lucide="zap" className="w-5 h-5"></i>
                            </div>
                            <div className="text-left leading-tight">
                                <h1 className="font-extrabold text-xl tracking-tight text-slate-900">EduFlow Dasis</h1>
                                <p className="text-[9px] text-slate-400 uppercase tracking-[0.2em] font-bold">Engine by INISIAL TH</p>
                            </div>
                        </div>
                        <div className="flex bg-slate-100 p-1.5 rounded-2xl gap-1">
                            <button onClick={() => setView('student')} className={`px-5 py-2 rounded-xl text-sm font-bold transition-all ${view === 'student' ? 'bg-white shadow-md text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>Siswa</button>
                            <button onClick={() => setView(isAuthenticated ? 'admin' : 'login')} className={`px-5 py-2 rounded-xl text-sm font-bold transition-all ${view === 'admin' || view === 'login' ? 'bg-white shadow-md text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>Admin</button>
                            
                            {isAuthenticated && (
                                <>
                                    <button 
                                        onClick={() => setView('settings')} 
                                        className={`px-3 py-2 rounded-xl text-sm font-bold transition-all ${view === 'settings' ? 'bg-white shadow-md text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}
                                        title="Pengaturan Mesin"
                                    >
                                        <i data-lucide="settings" className="w-4 h-4"></i>
                                    </button>
                                    <button 
                                        onClick={() => {setIsAuthenticated(false); setView('student');}} 
                                        className="p-2 text-red-500 hover:bg-red-50 rounded-xl transition-all"
                                        title="Logout"
                                    >
                                        <i data-lucide="log-out" className="w-4 h-4"></i>
                                    </button>
                                </>
                            )}
                        </div>
                    </nav>

                    <main className="max-w-6xl mx-auto p-6 md:p-10">
                        {view === 'login' && (
                            <div className="max-w-sm mx-auto mt-20 bg-white p-10 rounded-[2.5rem] shadow-2xl shadow-blue-100 border border-slate-100 text-center">
                                <div className="w-20 h-20 bg-blue-50 rounded-3xl flex items-center justify-center mx-auto mb-8 text-blue-600 shadow-inner">
                                    <i data-lucide="lock" className="w-10 h-10"></i>
                                </div>
                                <h2 className="text-2xl font-black mb-2">Akses Admin</h2>
                                <p className="text-slate-400 text-sm mb-8 font-medium">Masukkan sandi master untuk masuk.</p>
                                <form onSubmit={handleLogin} className="space-y-4 text-left">
                                    <input 
                                        type="password" 
                                        placeholder="Password" 
                                        className="w-full px-6 py-4 rounded-2xl border border-slate-200 outline-none focus:ring-4 focus:ring-blue-100 transition-all text-center font-bold" 
                                        value={adminPassword} 
                                        onChange={(e)=>setAdminPassword(e.target.value)} 
                                    />
                                    <button className="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-xl shadow-blue-200 hover:bg-blue-700 transition-all">OTENTIKASI</button>
                                </form>
                            </div>
                        )}

                        {view === 'student' && (
                            <div className="grid lg:grid-cols-12 gap-10 items-start">
                                <div className="lg:col-span-8 bg-white p-8 md:p-12 rounded-[2.5rem] border border-slate-200 shadow-xl shadow-slate-100">
                                    <div className="flex items-center gap-4 mb-10 text-left">
                                        <div className="bg-blue-50 p-4 rounded-2xl text-blue-600">
                                            <i data-lucide="upload-cloud" className="w-8 h-8"></i>
                                        </div>
                                        <div>
                                            <h2 className="text-3xl font-black text-slate-900">Portal Berkas</h2>
                                            <p className="text-slate-400 font-semibold tracking-wide uppercase text-[10px]">Data Induk Siswa Digital</p>
                                        </div>
                                    </div>
                                    
                                    <form onSubmit={runAutomation} className="space-y-10 text-left">
                                        <div className="space-y-3">
                                            <label className="text-xs font-black text-slate-400 uppercase tracking-widest ml-1 block">Nama Lengkap Siswa</label>
                                            <input 
                                                type="text" 
                                                className="w-full px-6 py-5 rounded-2xl border border-slate-200 outline-none text-xl font-bold focus:ring-4 focus:ring-blue-50 transition-all bg-slate-50" 
                                                placeholder="Contoh: Andi Pratama" 
                                                value={studentData.nama} 
                                                onChange={(e)=>setStudentData({...studentData, nama:e.target.value})} 
                                            />
                                        </div>
                                        
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                                            <FileUploadCard label="Foto KK" iconName="users" iconColor="text-blue-500" file={studentData.kk} onChange={(e)=>setStudentData({...studentData, kk:e.target.files[0]})} />
                                            <FileUploadCard label="Foto Akte" iconName="file-badge" iconColor="text-emerald-500" file={studentData.akte} onChange={(e)=>setStudentData({...studentData, akte:e.target.files[0]})} />
                                            <FileUploadCard label="Buku PIP" iconName="landmark" iconColor="text-amber-500" file={studentData.pip} onChange={(e)=>setStudentData({...studentData, pip:e.target.files[0]})} />
                                        </div>

                                        <button 
                                            disabled={isProcessing} 
                                            className={`w-full py-6 rounded-[2rem] font-black text-white shadow-2xl transition-all flex justify-center items-center gap-4 text-xl tracking-tight ${isProcessing ? 'bg-slate-300' : 'bg-blue-600 hover:bg-blue-700 hover:shadow-blue-300 active:scale-95'}`}
                                        >
                                            {isProcessing ? <i data-lucide="loader-2" className="animate-spin w-6 h-6"></i> : <i data-lucide="zap" className="w-6 h-6"></i>}
                                            {isProcessing ? 'SEDANG MEMINDAI...' : 'PROSES DOKUMEN DIGITAL'}
                                        </button>
                                    </form>
                                </div>
                                
                                <div className="lg:col-span-4 bg-slate-900 rounded-[2.5rem] p-10 text-white shadow-2xl shadow-blue-900/20 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full blur-3xl -mt-10 -mr-10"></div>
                                    <h3 className="font-black text-xl mb-10 border-b border-white/10 pb-6 text-left tracking-tight">Status Mesin Dasis</h3>
                                    <div className="space-y-8 relative z-10">
                                        <Step active={step >= 1} current={step === 1} label="Cloud Upload" desc="Drive Storage" />
                                        <Step active={step >= 2} current={step === 2} label="OCR Scanning" desc="Vision AI Scan" />
                                        <Step active={step >= 3} current={step === 3} label="Database Sync" desc="Google Sheets" />
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'admin' && (
                            <div className="bg-white rounded-[2.5rem] border border-slate-200 overflow-hidden shadow-2xl shadow-slate-100">
                                <div className="p-10 border-b border-slate-100 flex flex-col md:flex-row justify-between items-center gap-6">
                                    <div className="text-left">
                                        <h2 className="text-3xl font-black text-slate-900 leading-tight">Database Digital</h2>
                                        <p className="text-slate-400 font-bold uppercase text-[10px] tracking-widest mt-1">Log Aktivitas Mesin Dasis</p>
                                    </div>
                                    <button className="bg-emerald-50 text-emerald-700 px-8 py-4 rounded-2xl font-black text-sm hover:bg-emerald-100 flex items-center gap-3 transition-all shadow-sm border border-emerald-100">
                                        <i data-lucide="table" className="w-5 h-5"></i> BUKA GOOGLE SHEETS
                                    </button>
                                </div>
                                <div className="overflow-x-auto text-left">
                                    <table className="w-full">
                                        <thead className="bg-slate-50 text-[10px] uppercase font-black text-slate-400 tracking-widest">
                                            <tr>
                                                <th className="px-10 py-6">Nama Siswa</th>
                                                <th className="px-10 py-6">Status</th>
                                                <th className="px-10 py-6">Waktu Selesai</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50">
                                            {logs.map(log => (
                                                <tr key={log.id} className="hover:bg-slate-50/50 transition-all group">
                                                    <td className="px-10 py-6 font-extrabold text-slate-700">{log.nama}</td>
                                                    <td className="px-10 py-6">
                                                        <div className="inline-flex items-center gap-2 bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full text-[10px] font-black uppercase">
                                                            <i data-lucide="check-circle-2" className="w-3 h-3"></i> TERPROSES
                                                        </div>
                                                    </td>
                                                    <td className="px-10 py-6 text-slate-400 font-bold text-xs tracking-tight">{log.waktu}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {view === 'settings' && (
                            <div className="max-w-2xl mx-auto bg-white p-10 rounded-[2.5rem] shadow-2xl shadow-slate-100 border border-slate-200">
                                <div className="flex items-center gap-4 mb-10 text-left">
                                    <div className="bg-slate-100 p-4 rounded-2xl text-slate-800">
                                        <i data-lucide="settings" className="w-8 h-8"></i>
                                    </div>
                                    <div>
                                        <h2 className="text-2xl font-black text-slate-900">Konfigurasi Cloud</h2>
                                        <p className="text-slate-400 font-bold uppercase text-[10px] tracking-widest">Pengaturan Mesin EduFlow Dasis</p>
                                    </div>
                                </div>
                                
                                <div className="space-y-6 text-left">
                                    <ConfigInput label="Google Cloud API Key" value={config.apiKey} onChange={(val)=>setConfig({...config, apiKey: val})} />
                                    <ConfigInput label="OAuth Client ID" value={config.clientId} onChange={(val)=>setConfig({...config, clientId: val})} />
                                    <ConfigInput label="Google Drive Folder ID" value={config.folderId} onChange={(val)=>setConfig({...config, folderId: val})} />
                                    <ConfigInput label="Google Spreadsheet ID" value={config.spreadsheetId} onChange={(val)=>setConfig({...config, spreadsheetId: val})} />
                                    
                                    <div className="pt-6 border-t border-slate-100">
                                        <label className="text-xs font-black text-slate-400 uppercase tracking-widest block mb-2">Password Admin Baru</label>
                                        <input 
                                            type="text" 
                                            className="w-full px-5 py-4 rounded-2xl border border-slate-200 outline-none text-sm font-bold bg-slate-50" 
                                            value={config.masterPassword} 
                                            onChange={(e)=>setConfig({...config, masterPassword: e.target.value})} 
                                        />
                                    </div>
                                    
                                    <button 
                                        onClick={() => showNotify('success', 'Konfigurasi telah disimpan secara lokal.')}
                                        className="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest shadow-xl hover:bg-black transition-all"
                                    >
                                        SIMPAN PERUBAHAN
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="py-16 text-slate-300 text-[10px] uppercase font-black tracking-[0.5em] mt-10">
                        &copy; 2024 EduFlow Dasis Standalone &bull; INISIAL TH
                    </footer>
                </div>
            );
        };

        const ConfigInput = ({ label, value, onChange }) => (
            <div>
                <label className="text-xs font-black text-slate-400 uppercase tracking-widest block mb-2">{label}</label>
                <input 
                    type="text" 
                    className="w-full px-5 py-4 rounded-2xl border border-slate-200 outline-none text-sm font-mono bg-white focus:ring-4 focus:ring-blue-50 transition-all" 
                    placeholder="Masukkan kode..." 
                    value={value} 
                    onChange={(e)=>onChange(e.target.value)}
                />
            </div>
        );

        const Step = ({ active, current, label, desc }) => (
            <div className={`flex items-start gap-5 transition-all duration-700 text-left ${active ? 'opacity-100 translate-x-0' : 'opacity-20 -translate-x-4'}`}>
                <div className={`w-10 h-10 rounded-2xl flex items-center justify-center flex-shrink-0 transition-all shadow-lg ${current ? 'bg-yellow-400 animate-pulse ring-8 ring-yellow-400/20 shadow-yellow-400/20' : active ? 'bg-emerald-500 shadow-emerald-500/20' : 'bg-slate-800'}`}>
                    {active && !current ? <i data-lucide="check" className="w-5 h-5 text-white"></i> : <div className="w-2 h-2 bg-white/40 rounded-full"></div>}
                </div>
                <div className="flex flex-col text-left">
                    <span className={`text-base font-black tracking-tight ${current ? 'text-yellow-400' : 'text-white'}`}>{label}</span>
                    <span className="text-[10px] text-white/30 font-bold uppercase tracking-widest">{desc}</span>
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
